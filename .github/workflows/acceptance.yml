name: acceptance

on:
  # On pull requests too. The suite costs about 90 seconds and it has caught
  # defects that every other gate missed, each of which reached main and had to
  # be fixed forward. It needs no secrets, so it works on forks.
  pull_request:
    branches: [main]
  schedule:
    # 03:17 UTC nightly — offset from the hour to dodge GitHub's cron spikes.
    # Still worth it: the Synapse image is unpinned and moves under us.
    - cron: '17 3 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testacc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # terraform-plugin-testing drives a real CLI binary. Without this it
      # downloads Terraform from releases.hashicorp.com at test time.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          tofu_wrapper: false

      - name: Start Synapse
        run: docker compose -f ci/compose.synapse.yml up -d

      # Directory publication and the rate limits are properties of the test
      # environment rather than anything the suite asserts. ci/synapse-overrides.yaml
      # says what each one is for.
      - name: Configure Synapse for the suite
        run: |
          docker compose -f ci/compose.synapse.yml exec -T synapse \
            sh -c 'cat >> /data/homeserver.yaml' < ci/synapse-overrides.yaml
          docker compose -f ci/compose.synapse.yml restart synapse

      - name: Wait for Synapse
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8008/_matrix/client/versions >/dev/null 2>&1; then
              echo "Synapse is up"; exit 0
            fi
            sleep 2
          done
          echo "Synapse never came up"; exit 1

      - name: Register test user & fetch token
        id: register
        run: |
          docker compose -f ci/compose.synapse.yml exec -T synapse \
            register_new_matrix_user -u tf -p tfpass -a -c /data/homeserver.yaml http://localhost:8008
          TOKEN=$(curl -s -XPOST http://localhost:8008/_matrix/client/v3/login \
            -H 'Content-Type: application/json' \
            -d '{"type":"m.login.password","user":"tf","password":"tfpass"}' | jq -r .access_token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          MATRIX_HOMESERVER_URL: http://localhost:8008
          MATRIX_ACCESS_TOKEN: ${{ steps.register.outputs.token }}
          MATRIX_USER_ID: "@tf:localhost"
          # The harness reattaches the in-process provider under this address,
          # which has to match the source the test configs declare. Terraform
          # users leave both unset and declare hashicorp/matrix instead.
          TF_ACC_PROVIDER_HOST: registry.opentofu.org
          TF_ACC_PROVIDER_NAMESPACE: raspbeguy
        # TF_ACC_TERRAFORM_PATH has to be absolute, so it is resolved here
        # rather than set to a bare name in the env block above.
        run: |
          TF_ACC_TERRAFORM_PATH="$(command -v tofu)" \
            go test -v -timeout 25m ./internal/provider/... -run '^TestAcc'

      - name: Synapse logs on failure
        if: failure()
        run: docker compose -f ci/compose.synapse.yml logs synapse
