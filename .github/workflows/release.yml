name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # to create the GitHub Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # goreleaser needs full history for changelog/version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  notify:
    needs: goreleaser
    runs-on: ubuntu-latest
    continue-on-error: true  # a Matrix outage must not fail the release
    steps:
      - name: Send Matrix notification
        env:
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}
          MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          tag="${{ github.ref_name }}"
          url="${{ github.server_url }}/$repo/releases/tag/$tag"

          body=$(printf 'New release of %s: %s\n%s' "$repo" "$tag" "$url")
          html=$(printf 'New release of <b>%s</b>: <a href="%s">%s</a>' "$repo" "$url" "$tag")

          payload=$(jq -n \
            --arg body "$body" \
            --arg html "$html" \
            '{msgtype:"m.text", body:$body, format:"org.matrix.custom.html", formatted_body:$html}')

          txn="${{ github.run_id }}-${{ github.run_attempt }}"
          curl -fsS -X PUT \
            -H "Authorization: Bearer $MATRIX_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$MATRIX_HOMESERVER/_matrix/client/v3/rooms/$MATRIX_ROOM_ID/send/m.room.message/$txn"
